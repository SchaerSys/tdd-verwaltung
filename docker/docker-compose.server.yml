name: tdd
networks:
  tdd-net:
    driver: bridge
volumes:
  tdd-db-data:
  tdd-uploads:
  caddy-data:
  caddy-config:
services:
  postgres:
    image: postgres:16-alpine
    container_name: tdd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tdd
      POSTGRES_USER: tdd_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - tdd-db-data:/var/lib/postgresql/data
    networks: [tdd-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdd_owner -d tdd"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tdd-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_DIR: /data/uploads
      NODE_ENV: production
      JOB_TOKEN: ${JOB_TOKEN}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      OSRM_URL: http://osrm:5000
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-e3b29c11-0000-4000-a000-000000000000}
      TENANT_HOSTS: ${TENANT_HOSTS:-}
      SMTP_KEY: ${SMTP_KEY}
      HOMEPAGE_API_URL: ${HOMEPAGE_API_URL:-}
      UEBERGABE_TOKEN: ${UEBERGABE_TOKEN:-}
    volumes:
      - tdd-uploads:/data/uploads
    ports:
      - "127.0.0.1:3080:3000"
    networks: [tdd-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
  ops:
    build:
      context: .
      dockerfile: apps/ops/Dockerfile
    container_name: tdd-ops
    restart: unless-stopped
    environment:
      OPS_DATABASE_URL: ${OPS_DATABASE_URL}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-e3b29c11-0000-4000-a000-000000000000}
      SMTP_KEY: ${SMTP_KEY}
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET}
      NODE_ENV: production
      APP_URL: ${APP_URL}
      APP_DOMAIN: tdd.schaer-systems.at
      WEB_HEALTH_URL: http://web:3000/api/health
      OPS_DIR: /ops
      HOST_DIR: /host
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      # Anfragen an den Host-Agenten (Backup, Neustart) und der Wartungsmodus-Schalter.
      - ./ops:/ops
      # Nur lesen: Backup-Log, Migrationsbuch, Plattenbelegung von /opt/tdd.
      - /opt/tdd:/host:ro
    ports:
      - "127.0.0.1:3081:3000"
    networks: [tdd-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
  osrm:
    # Routing fuer A4 (Karte, Reihenfolge-Optimierung). Daten: scripts/osrm-setup.sh.
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: tdd-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-trip-size 60 --max-table-size 200 /data/vorarlberg-latest.osrm
    volumes:
      - ./osrm:/data:ro
    networks: [tdd-net]
  caddy:
    image: caddy:2-alpine
    container_name: tdd-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ops:/ops:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [tdd-net]
    depends_on: [web, ops]
