name: tdd
networks:
  tdd-net:
    driver: bridge
volumes:
  tdd-db-data:
  tdd-uploads:
  caddy-data:
  caddy-config:
services:
  postgres:
    image: postgres:16-alpine
    container_name: tdd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tdd
      POSTGRES_USER: tdd_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    volumes:
      - tdd-db-data:/var/lib/postgresql/data
    networks: [tdd-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdd_owner -d tdd"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tdd-web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_DIR: /data/uploads
      NODE_ENV: production
      JOB_TOKEN: ${JOB_TOKEN}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - tdd-uploads:/data/uploads
    ports:
      - "127.0.0.1:3080:3000"
    networks: [tdd-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    container_name: tdd-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [tdd-net]
    depends_on: [web]
